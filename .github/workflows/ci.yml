name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check and build
        run: |
          npx tsc --noEmit
          node --check public/boot.js
          npm run build
          test -s dist/index.html
          test -s dist/boot.js

      - name: Verify world layout
        run: |
          npm run measure
          npm run room
